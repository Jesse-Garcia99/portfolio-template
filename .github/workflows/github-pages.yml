# Optional. Delete this file if you deploy with Cloudflare Pages.
#
# Run it once from the Actions tab ("Run workflow") and it turns GitHub Pages
# on for you. To deploy on every push after that, uncomment the push trigger
# below. It is manual by default so the template does not fail for people who
# deploy somewhere else.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A project site is served from https://<user>.github.io/<repo>, so every
      # asset needs that prefix. Delete these two lines if you use a custom
      # domain or a <user>.github.io repo, which both serve from the root.
      BASE_PATH: /${{ github.event.repository.name }}
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      # Stops GitHub Pages from running Jekyll over the export, which would
      # drop the _next directory.
      - run: touch out/.nojekyll
      # enablement turns Pages on for the repo, so there is nothing to click
      # in Settings before the first run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
